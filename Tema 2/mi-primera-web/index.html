<!DOCTYPE html>
<html>

<head>
    <!-- Metadatos -->
    <title>Mi primera pagina web</title>

    <link rel="stylesheet" href="index.css"> <!-- añade estilos, sin cierre -->
    <script src="index.js"></script> <!-- Añade funcionalidad con JavaScript-->
</head>

<body>
    <!-- La parte visible de la web -->
    <div class="content">
        <h1>Titulo de mi pagina web</h1>

            Esto es un parrafo de texto donde estamos

        </p>

            correctamente <mark>agrupados</mark>.
        </p>
        <a href="https://fpalanturing.es/" target="_blank">Documento PDF</a>
    </div>

</html>
